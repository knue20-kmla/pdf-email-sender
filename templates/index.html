<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMLA 자동 발송 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            padding: 50px 40px;
            max-width: 650px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
            flex-wrap: wrap;
        }

        .breadcrumb-item {
            cursor: pointer;
            color: #2a5298;
            transition: color 0.2s;
        }

        .breadcrumb-item:hover {
            color: #1e3c72;
            text-decoration: underline;
        }

        .breadcrumb-item.current {
            color: #333;
            font-weight: 600;
            cursor: default;
        }

        .breadcrumb-item.current:hover {
            text-decoration: none;
        }

        .breadcrumb-separator {
            color: #ccc;
        }

        .folder-list {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            background: #fafafa;
        }

        .folder-item {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .folder-item:last-child {
            border-bottom: none;
        }

        .folder-item:hover {
            background: #f0f4f8;
        }

        .folder-item.selected {
            background: #e3f2fd;
            font-weight: 600;
        }

        .folder-icon {
            font-size: 18px;
        }

        .empty-folder {
            padding: 40px 20px;
            text-align: center;
            color: #999;
        }

        .select-button {
            margin-top: 10px;
            padding: 10px 20px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            width: auto;
            display: inline-block;
        }

        .select-button:hover {
            background: #1e3c72;
            transform: translateY(-1px);
        }

        .select-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        .or-divider {
            text-align: center;
            color: #999;
            margin: 20px 0;
            position: relative;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #e0e0e0;
        }

        .or-divider::before {
            left: 0;
        }

        .or-divider::after {
            right: 0;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: linear-gradient(135deg, #ccc 0%, #999 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .result-item {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-item.success {
            background: #d4edda;
            color: #155724;
        }

        .result-item.error {
            background: #f8d7da;
            color: #721c24;
        }

        .result-item .icon {
            font-size: 20px;
        }

        .loading {
            text-align: center;
            color: #2a5298;
            margin-top: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2a5298;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://i.imgur.com/Mo4ogKc.png" alt="KMLA Logo" class="logo">
            <h1>KMLA 자동 발송 시스템</h1>
            <p class="subtitle">성적표 및 문서를 자동으로 이메일 발송합니다</p>
        </div>

        <form id="sendForm">
            <div class="form-group">
                <label for="folderBrowser" style="cursor: pointer; display: flex; align-items: center; justify-content: space-between;" onclick="toggleFolderList()">
                    <span>📁 발송 자료 선택</span>
                    <span id="toggleIcon" style="transition: transform 0.3s;">▼</span>
                </label>
                <div id="folderBrowserContainer" style="display: none;">
                    <div class="breadcrumb" id="breadcrumb">
                        <span class="breadcrumb-item current" data-id="root">내 드라이브</span>
                    </div>
                    <div class="folder-list" id="folderList">
                        <div class="empty-folder">폴더를 불러오는 중...</div>
                    </div>
                    <button type="button" class="select-button" id="selectFolderBtn" disabled>이 폴더 선택</button>
                </div>
            </div>

            <div class="or-divider">또는</div>

            <div class="form-group">
                <label for="folderId">🔗 폴더 ID 직접 입력</label>
                <input type="text" id="folderId" name="folder_id" placeholder="예: 1a2B3c4D5e6F7g8H9i0J">
            </div>

            <button type="submit" id="sendBtn">📧 발송하기</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>이메일 발송 중...</p>
        </div>

        <div class="results" id="results">
            <h2>발송 결과</h2>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        let currentFolderId = 'root';
        let currentFolderName = '내 드라이브';
        let selectedFolderId = null;
        let selectedFolderName = null;
        let breadcrumbPath = [{id: 'root', name: '내 드라이브'}];
        let folderListLoaded = false;

        // 폴더 리스트 토글
        function toggleFolderList() {
            const container = document.getElementById('folderBrowserContainer');
            const icon = document.getElementById('toggleIcon');

            if (container.style.display === 'none') {
                container.style.display = 'block';
                icon.style.transform = 'rotate(180deg)';

                // 처음 열 때만 폴더 로드
                if (!folderListLoaded) {
                    loadFolders('root');
                    folderListLoaded = true;
                }
            } else {
                container.style.display = 'none';
                icon.style.transform = 'rotate(0deg)';
            }
        }

        // 페이지 로드 시에는 자동으로 폴더를 불러오지 않음
        window.addEventListener('DOMContentLoaded', async () => {
            // 폴더 목록은 사용자가 클릭할 때만 로드
        });

        // 폴더 목록 로드
        async function loadFolders(parentId) {
            const folderList = document.getElementById('folderList');
            folderList.innerHTML = '<div class="empty-folder">폴더를 불러오는 중...</div>';

            try {
                const response = await fetch(`/api/folders?parent_id=${parentId}`);
                const folders = await response.json();

                if (folders.error) {
                    folderList.innerHTML = '<div class="empty-folder">폴더를 불러올 수 없습니다</div>';
                    return;
                }

                if (folders.length === 0) {
                    folderList.innerHTML = '<div class="empty-folder">하위 폴더가 없습니다</div>';
                    return;
                }

                folderList.innerHTML = '';
                folders.forEach(folder => {
                    const div = document.createElement('div');
                    div.className = 'folder-item';
                    div.innerHTML = `<span class="folder-icon">📁</span><span>${folder.name}</span>`;
                    div.onclick = () => navigateToFolder(folder.id, folder.name);
                    folderList.appendChild(div);
                });
            } catch (error) {
                console.error('폴더 목록 로드 실패:', error);
                folderList.innerHTML = '<div class="empty-folder">폴더를 불러올 수 없습니다</div>';
            }
        }

        // 폴더로 이동
        function navigateToFolder(folderId, folderName) {
            currentFolderId = folderId;
            currentFolderName = folderName;

            // breadcrumb 업데이트
            breadcrumbPath.push({id: folderId, name: folderName});
            updateBreadcrumb();

            // 새 폴더 로드
            loadFolders(folderId);

            // 선택 버튼 활성화
            selectedFolderId = folderId;
            selectedFolderName = folderName;
            document.getElementById('selectFolderBtn').disabled = false;
        }

        // breadcrumb 업데이트
        function updateBreadcrumb() {
            const breadcrumb = document.getElementById('breadcrumb');
            breadcrumb.innerHTML = '';

            breadcrumbPath.forEach((item, index) => {
                const span = document.createElement('span');
                span.className = index === breadcrumbPath.length - 1 ? 'breadcrumb-item current' : 'breadcrumb-item';
                span.textContent = item.name;
                span.dataset.id = item.id;

                if (index < breadcrumbPath.length - 1) {
                    span.onclick = () => navigateBack(index);
                }

                breadcrumb.appendChild(span);

                if (index < breadcrumbPath.length - 1) {
                    const separator = document.createElement('span');
                    separator.className = 'breadcrumb-separator';
                    separator.textContent = '›';
                    breadcrumb.appendChild(separator);
                }
            });
        }

        // breadcrumb에서 뒤로 가기
        function navigateBack(index) {
            breadcrumbPath = breadcrumbPath.slice(0, index + 1);
            const target = breadcrumbPath[index];
            currentFolderId = target.id;
            currentFolderName = target.name;
            updateBreadcrumb();
            loadFolders(target.id);
        }

        // 폴더 선택 버튼
        document.getElementById('selectFolderBtn').addEventListener('click', () => {
            if (selectedFolderId) {
                alert(`선택된 폴더: ${selectedFolderName}`);
            }
        });

        // 폼 제출 처리
        document.getElementById('sendForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const folderIdInput = document.getElementById('folderId').value;
            const folderId = folderIdInput || selectedFolderId;
            const folderName = folderIdInput ? folderIdInput : selectedFolderName;

            if (!folderId) {
                alert('폴더를 선택하거나 폴더 ID를 입력해주세요.');
                return;
            }

            // UI 업데이트
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.remove('show');

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        folder_id: folderId,
                        folder_name: folderName
                    })
                });

                const data = await response.json();

                if (data.error) {
                    alert('오류: ' + data.error);
                    return;
                }

                // 결과 표시
                const resultsList = document.getElementById('resultsList');
                resultsList.innerHTML = '';

                data.results.forEach(result => {
                    const div = document.createElement('div');
                    div.className = `result-item ${result.status}`;

                    const icon = result.status === 'success' ? '✅' : '❌';
                    const message = result.status === 'success' ?
                        `${result.name} → ${result.email}` :
                        `${result.name}: ${result.message}`;

                    div.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
                    resultsList.appendChild(div);
                });

                document.getElementById('results').classList.add('show');

            } catch (error) {
                alert('발송 중 오류가 발생했습니다: ' + error.message);
            } finally {
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('loading').classList.remove('show');
            }
        });
    </script>
</body>
</html>
