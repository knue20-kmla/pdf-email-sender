<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMLA 자동 발송 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
            padding: 50px 40px;
            max-width: 650px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: block;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42, 82, 152, 0.1);
        }

        .or-divider {
            text-align: center;
            color: #999;
            margin: 20px 0;
            position: relative;
        }

        .or-divider::before,
        .or-divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: #e0e0e0;
        }

        .or-divider::before {
            left: 0;
        }

        .or-divider::after {
            right: 0;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(30, 60, 114, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: linear-gradient(135deg, #ccc 0%, #999 100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }

        .result-item {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-item.success {
            background: #d4edda;
            color: #155724;
        }

        .result-item.error {
            background: #f8d7da;
            color: #721c24;
        }

        .result-item .icon {
            font-size: 20px;
        }

        .loading {
            text-align: center;
            color: #2a5298;
            margin-top: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2a5298;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://i.imgur.com/Mo4ogKc.png" alt="KMLA Logo" class="logo">
            <h1>KMLA 자동 발송 시스템</h1>
            <p class="subtitle">성적표 및 문서를 자동으로 이메일 발송합니다</p>
        </div>

        <form id="sendForm">
            <div class="form-group">
                <label for="folderSelect">📁 구글 드라이브 폴더 선택</label>
                <select id="folderSelect" name="folder">
                    <option value="">폴더를 선택하세요...</option>
                </select>
            </div>

            <div class="or-divider">또는</div>

            <div class="form-group">
                <label for="folderId">🔗 폴더 ID 직접 입력</label>
                <input type="text" id="folderId" name="folder_id" placeholder="예: 1a2B3c4D5e6F7g8H9i0J">
            </div>

            <button type="submit" id="sendBtn">📧 발송하기</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>이메일 발송 중...</p>
        </div>

        <div class="results" id="results">
            <h2>발송 결과</h2>
            <div id="resultsList"></div>
        </div>
    </div>

    <script>
        // 페이지 로드 시 폴더 목록 가져오기
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('/api/folders');
                const folders = await response.json();

                const select = document.getElementById('folderSelect');
                folders.forEach(folder => {
                    const option = document.createElement('option');
                    option.value = folder.id;
                    option.textContent = folder.name;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('폴더 목록 로드 실패:', error);
            }
        });

        // 폼 제출 처리
        document.getElementById('sendForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const folderSelect = document.getElementById('folderSelect').value;
            const folderIdInput = document.getElementById('folderId').value;
            const folderId = folderIdInput || folderSelect;

            if (!folderId) {
                alert('폴더를 선택하거나 폴더 ID를 입력해주세요.');
                return;
            }

            // 폴더 이름 가져오기
            const folderName = folderIdInput ?
                folderIdInput :
                document.getElementById('folderSelect').options[document.getElementById('folderSelect').selectedIndex].text;

            // UI 업데이트
            document.getElementById('sendBtn').disabled = true;
            document.getElementById('loading').classList.add('show');
            document.getElementById('results').classList.remove('show');

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        folder_id: folderId,
                        folder_name: folderName
                    })
                });

                const data = await response.json();

                if (data.error) {
                    alert('오류: ' + data.error);
                    return;
                }

                // 결과 표시
                const resultsList = document.getElementById('resultsList');
                resultsList.innerHTML = '';

                data.results.forEach(result => {
                    const div = document.createElement('div');
                    div.className = `result-item ${result.status}`;

                    const icon = result.status === 'success' ? '✅' : '❌';
                    const message = result.status === 'success' ?
                        `${result.name} → ${result.email}` :
                        `${result.name}: ${result.message}`;

                    div.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
                    resultsList.appendChild(div);
                });

                document.getElementById('results').classList.add('show');

            } catch (error) {
                alert('발송 중 오류가 발생했습니다: ' + error.message);
            } finally {
                document.getElementById('sendBtn').disabled = false;
                document.getElementById('loading').classList.remove('show');
            }
        });
    </script>
</body>
</html>
